<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="100%" height="100%">
  <!-- Definitions for gradients and filters -->
  <defs>
    <!-- Background Circle Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </radialGradient>
    
    <!-- Bus Body Gradient (Blue) -->
    <linearGradient id="busBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    
    <!-- Bus Roof Gradient (White/Silver) -->
    <linearGradient id="busSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    
    <!-- Glass Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    
    <!-- Windshield Reflection -->
    <linearGradient id="reflectGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background decorative elements -->
  <circle cx="100" cy="70" r="55" fill="url(#bgGrad)" opacity="0.8" />
  
  <!-- Shadow under the bus -->
  <ellipse cx="100" cy="115" rx="75" ry="10" fill="#0F172A" opacity="0.2" filter="blur(2px)" />

  <!-- Bus Group with Drop Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Main Chassis / Lower Body -->
    <path d="M 45,95 L 45,108 A 4,4 0 0 0 49,112 L 151,112 A 4,4 0 0 0 155,108 L 155,95 Z" fill="#1E293B" />
    
    <!-- Left Side Panel (Angled away) -->
    <path d="M 35,55 L 75,50 L 75,105 L 35,102 Z" fill="#1E40AF" />
    <!-- Left Side Windows -->
    <path d="M 38,58 L 72,54 L 72,75 L 38,78 Z" fill="url(#glassGrad)" />
    <!-- Left Side Window Dividers -->
    <line x1="49" y1="57" x2="49" y2="77" stroke="#1E293B" stroke-width="1.5" />
    <line x1="61" y1="55" x2="61" y2="76" stroke="#1E293B" stroke-width="1.5" />
    
    <!-- Front Face Panel -->
    <path d="M 75,50 L 145,55 C 152,55.5 155,60 155,68 L 155,105 L 75,105 Z" fill="url(#busBlue)" />
    
    <!-- Roof Cap -->
    <path d="M 34,55 C 34,55 55,46 75,46 C 95,46 142,50 145,51 C 148,52 149,55 145,55 L 75,50 L 35,55 Z" fill="url(#busSilver)" />
    
    <!-- Front Windshield -->
    <path d="M 79,53 L 141,58 C 146,58.4 148,61 148,65 L 148,78 L 79,78 Z" fill="url(#glassGrad)" />
    <!-- Windshield Reflection Highlight -->
    <path d="M 79,53 L 120,56 L 100,78 L 79,78 Z" fill="url(#reflectGrad)" />
    
    <!-- Front Grill / Middle Band (White) -->
    <path d="M 75,82 L 155,82 L 155,88 L 75,88 Z" fill="#F8FAFC" />
    <!-- Brand Emblem or Logo -->
    <circle cx="115" cy="85" r="3" fill="#F5B700" />
    <path d="M 111,85 L 119,85" stroke="#F5B700" stroke-width="1" />
    
    <!-- Headlights -->
    <!-- Left Headlight -->
    <rect x="82" y="90" width="10" height="6" rx="2" fill="#FEF08A" />
    <rect x="84" y="92" width="6" height="2" rx="1" fill="#FFFFFF" />
    <!-- Right Headlight -->
    <rect x="138" y="90" width="10" height="6" rx="2" fill="#FEF08A" />
    <rect x="140" y="92" width="6" height="2" rx="1" fill="#FFFFFF" />
    
    <!-- Bumper -->
    <path d="M 75,98 L 155,98 C 155,98 153,105 148,105 L 82,105 C 77,105 75,98 75,98 Z" fill="#334155" />
    <!-- License Plate -->
    <rect x="105" y="99" width="20" height="5" rx="1" fill="#F5B700" />
    <text x="115" y="103" font-family="sans-serif" font-size="3.5" font-weight="bold" fill="#0F172A" text-anchor="middle">TAXI 09</text>
    
    <!-- Wheels -->
    <!-- Front Right Wheel -->
    <circle cx="60" cy="106" r="11" fill="#0F172A" />
    <circle cx="60" cy="106" r="6" fill="#94A3B8" />
    <circle cx="60" cy="106" r="3" fill="#475569" />
    
    <!-- Front Left Wheel -->
    <circle cx="125" cy="107" r="11" fill="#0F172A" />
    <circle cx="125" cy="107" r="6" fill="#94A3B8" />
    <circle cx="125" cy="107" r="3" fill="#475569" />
    
    <!-- Mirror (Right Side) -->
    <path d="M 148,68 L 158,68 L 158,74 L 148,74 Z" fill="#1E293B" />
    <path d="M 149,69 L 150,73" stroke="#94A3B8" stroke-width="1.5" />
  </g>
</svg>
